name: Build Courtside dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '17 15,20,1 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build_site.py'
      - 'src/weekly.py'
      - 'src/espn_client.py'
      - 'src/report.py'
      - 'site/**'
      - 'tests/**'
      - '.github/workflows/build-dashboard.yml'

permissions:
  contents: write

concurrency:
  group: courtside-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read archived projections
        uses: actions/checkout@v4
        with:
          ref: projection-history
          path: projection-archive
      - name: Test scoring and optimizer
        run: python -m unittest discover -s tests -v
      - name: Build read-only dashboard data
        env:
          COURTSIDE_HISTORY_DIR: projection-archive/snapshots
        run: python -m scripts.build_site
      - name: Check published JSON for prohibited fields
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          data = Path('site/data.json').read_text()
          payload = json.loads(data)
          assert payload['schema_version'] == 2
          assert len(payload['teams']) == 7
          assert len(payload['matchups']) >= 3
          for forbidden in ('espn_s2', 'ESPN_S2', 'SWID', 'owners', 'email', 'cookie', 'memberId', 'member_id'):
              assert forbidden not in data, 'Prohibited field in public payload: ' + forbidden
          print('Publication schema and sensitive-field checks passed')
          PY
      - name: Save point-in-time projections
        run: |
          git -C projection-archive config user.name "courtside-bot"
          git -C projection-archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C projection-archive add snapshots/
          if ! git -C projection-archive diff --cached --quiet; then
            git -C projection-archive commit -m "Record timestamped projections"
            git -C projection-archive push origin HEAD:projection-history
          fi
      - name: Upload private site preview
        uses: actions/upload-artifact@v4
        with:
          name: courtside-site-preview
          path: site/
          retention-days: 7
          if-no-files-found: error

  publish:
    if: vars.ENABLE_PUBLIC_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download sanitized site
        uses: actions/download-artifact@v4
        with:
          name: courtside-site-preview
          path: site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
